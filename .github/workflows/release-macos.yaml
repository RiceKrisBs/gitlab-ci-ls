name: Release macOS binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package
        run: tar -czf gitlab-ci-ls-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release gitlab-ci-ls

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: gitlab-ci-ls-aarch64-apple-darwin.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
